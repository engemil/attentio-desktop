[package]
name = "rust_lib_attentio_desktop"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
attentio = { path = "../attentio-cli" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.102"
env_logger = "0.11"
log = "0.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
